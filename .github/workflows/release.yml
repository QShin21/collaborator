name: release
# Builds the Windows installer and the portable zip and publishes them on the Releases page.
#   - push a tag:      git tag v0.4.0a2 && git push origin v0.4.0a2
#   - or run manually: Actions -> release -> Run workflow, and type the version
#
# NOTE: this workflow itself is NOT YET RUN (docs/verification.md, W-17): 0.4.0a1 was published
# by a one-time workflow with the same steps, because only commits to a branch were available
# to whoever published it. The build and the installer check are scripts shared with ci.yml
# (packaging/windows/build.ps1, verify-installer.ps1), so they run on every push.
#
# It never replaces anything: an existing release for the tag stops the run.
#
# What a green run means (evidence level E2 in docs/verification.md): the tests passed on a
# Windows runner, the packaged app starts, its windows can be built, the whole flow works with
# the offline stand-in, and the installer installs, runs and uninstalls on that runner. It does
# NOT mean the supervising model's judgement has been evaluated, that any real conversation
# was read, or that a person has used the app or the installer on a real desktop (E3–E5, see
# docs/acceptance.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.4.0a2 (must match banxing/__init__.py)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the version in the code, have its notes, and not be released yet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import banxing; print(banxing.__version__)" | Out-String).Trim()
          if ("v$version" -ne $env:VERSION) {
            throw "tag $env:VERSION does not match banxing.__version__ ($version)"
          }
          if (-not (Test-Path "docs/release-notes/$env:VERSION.md")) {
            throw "docs/release-notes/$env:VERSION.md is missing"
          }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "could not list the releases" }
          if (@($releases | Where-Object { $_.tag_name -eq $env:VERSION }).Count -ne 0) {
            throw "a release for $env:VERSION already exists; this workflow never overwrites one"
          }
          "BARE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Dependencies
        run: python -m pip install --upgrade pip -r requirements-windows.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build the Windows package and the installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version $env:BARE_VERSION

      - name: Installer check (silent install, run, reinstall, uninstall)
        shell: pwsh
        run: |
          $setup = "release\Banxing-$env:VERSION-windows-x64-setup.exe"
          ./packaging/windows/verify-installer.ps1 -Setup $setup -Version $env:BARE_VERSION -Report "release\installer-check.json"

      - name: Keep the build and reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ env.VERSION }}
          path: |
            release/*.exe
            release/*.zip
            release/*.sha256
            release/*.json
          if-no-files-found: ignore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Banxing ${{ env.VERSION }} Windows preview
          prerelease: true
          fail_on_unmatched_files: true
          body_path: docs/release-notes/${{ env.VERSION }}.md
          files: |
            release/*-setup.exe
            release/*.zip
            release/*.sha256
