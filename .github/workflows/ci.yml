name: ci
# NOTE: rewritten for the supervising app (0.4) and NOT YET RUN. Its first run is itself a
# test; see docs/verification.md, W-17.
on:
  push:
  pull_request:
jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one platform failing should not hide the other's result
      matrix:
        include:
          # Oldest supported interpreter. Python 3.9 is end-of-life and actions/setup-python
          # has no build of it for newer runner images, so this job is pinned to the newest
          # image that still has one. When ubuntu-24.04 is retired, raise the minimum Python
          # version here and in README/CLAUDE.md together.
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          # The platform the app is for.
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Optional Windows dependencies (tray icon)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip -r requirements-windows.txt

      # Linux: a virtual display lets the Tk shell tests run for real (they skip without one).
      - name: Unit tests (offline, synthetic data only)
        if: runner.os != 'Windows'
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi

      - name: Unit tests (offline, synthetic data only)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Self-test
        if: runner.os != 'Windows'
        run: python run.py --selftest --report "$RUNNER_TEMP/selftest.json"

      - name: Self-test (Tk and the Win32 shell calls must work)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python run.py --selftest --require tk,win32 --report "$env:RUNNER_TEMP\selftest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The labelled conversations through the offline stand-in: shows that the whole
      # pipeline runs on this platform. It says nothing about the quality of supervision.
      - name: Replay (offline stand-in, plumbing only)
        env:
          BANXING_PROVIDER: mock
        run: python run.py --replay --report "${{ runner.temp }}/replay.json"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/selftest.json
            ${{ runner.temp }}/replay.json
          if-no-files-found: ignore
