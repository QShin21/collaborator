name: release-once-v0.4.0a1
# ONE-TIME release of exactly one version from exactly one commit. NOT YET RUN at the time of
# this commit. Delete this file once v0.4.0a1 is published (deleting it triggers nothing).
#
# Why it exists: the regular release workflow (release.yml) starts on a pushed tag or a manual
# dispatch, and neither was available to the coordinator for this release — only commits to a
# branch were. This file is the same build, started by the commit that adds it.
#
# What it does: the steps of release.yml, unchanged — version check, dependencies, tests,
# PyInstaller build, self-test of the packaged app, packaging, pre-release — for
#     version  v0.4.0a1
#     commit   f7bb5b6b3bbef7d30d97ee7aa8115ae84328ad14   (tree a470cc97625b19a659e88a7d4cc5cd3dc8214fa8)
# which is the commit CI run 44225112650 passed on. The build is made from THAT commit, not from
# the commit that carries this file, and the tag is created on THAT commit.
#
# What it refuses (the "guard" step, before anything is built):
#   - any repository or branch other than QShin21/collaborator, main;
#   - a main that holds anything since the pinned commit other than this one file;
#   - a pinned commit whose tree, or whose CI run, is not the one named above;
#   - an existing tag or release v0.4.0a1 — nothing is ever overwritten.
# It cannot release any other version: version, commit, tree and CI run are constants below, and
# it starts only on a push to main that changes THIS file. Releases of later versions go through
# release.yml as before. (A tag created here with the workflow's own token does not start
# release.yml: events made with that token start no workflows.)
#
# What a green run means: evidence level E2 for the build (docs/verification.md) — the tests
# passed on a Windows runner and the packaged app passed its self-test with the offline
# stand-in. It does NOT mean the supervising model's judgement has been evaluated, or that any
# real conversation was read.
on:
  push:
    branches: [main]
    paths: [".github/workflows/release-once-v0.4.0a1.yml"]

permissions:
  contents: write    # create the tag and the pre-release
  actions: read      # look up the CI run of the pinned commit

concurrency:
  group: release-once-v0.4.0a1
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'QShin21/collaborator' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      VERSION: v0.4.0a1
      TARGET_SHA: f7bb5b6b3bbef7d30d97ee7aa8115ae84328ad14
      TARGET_TREE: a470cc97625b19a659e88a7d4cc5cd3dc8214fa8
      CI_RUN_ID: "44225112650"
      THIS_FILE: .github/workflows/release-once-v0.4.0a1.yml
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — only this version, only this commit, nothing overwritten
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Fail($why) { Write-Host "::error::$why"; exit 1 }
          if ($env:GITHUB_REPOSITORY -ne "QShin21/collaborator") { Fail "wrong repository: $env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF -ne "refs/heads/main") { Fail "wrong ref: $env:GITHUB_REF" }

          # The pinned commit is in main's history, and main holds nothing since it but this file.
          git merge-base --is-ancestor $env:TARGET_SHA HEAD
          if ($LASTEXITCODE -ne 0) { Fail "$env:TARGET_SHA is not an ancestor of main" }
          $changed = @(git diff --name-only $env:TARGET_SHA HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne $env:THIS_FILE) {
            Fail "main differs from the pinned commit in more than this workflow file: $($changed -join ', ')"
          }
          $tree = git rev-parse ($env:TARGET_SHA + '^{tree}')
          if ($tree -ne $env:TARGET_TREE) { Fail "the pinned commit's tree is $tree, expected $env:TARGET_TREE" }

          # Nothing is overwritten: neither a tag nor a release (drafts included) may exist.
          $tags = git ls-remote --tags origin "refs/tags/$env:VERSION"
          if ($LASTEXITCODE -ne 0) { Fail "could not list the remote tags" }
          if ($tags) { Fail "tag $env:VERSION already exists; this workflow never moves or reuses a tag" }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { Fail "could not list the releases" }
          if (@($releases | Where-Object { $_.tag_name -eq $env:VERSION }).Count -ne 0) {
            Fail "a release for $env:VERSION already exists; this workflow never overwrites one"
          }

          # The pinned commit is the one CI passed on.
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CI_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { Fail "could not read CI run $env:CI_RUN_ID" }
          if ($run.path -ne ".github/workflows/ci.yml" -or $run.head_sha -ne $env:TARGET_SHA `
              -or $run.status -ne "completed" -or $run.conclusion -ne "success") {
            Fail "CI run $env:CI_RUN_ID is not a successful ci run of $env:TARGET_SHA ($($run.path), $($run.head_sha), $($run.conclusion))"
          }

          # From here on the working copy IS the pinned commit.
          git checkout --quiet --detach $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { Fail "could not check out $env:TARGET_SHA" }
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { Fail "HEAD is not the pinned commit" }
          if (git status --porcelain) { Fail "the working copy is not clean" }
          if (Test-Path $env:THIS_FILE) { Fail "this workflow file must not be part of the build" }
          Write-Host "building $env:VERSION from $env:TARGET_SHA (tree $tree), CI run $env:CI_RUN_ID: $($run.conclusion)"

      # ---- from here on: the steps of release.yml, unchanged ------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the version in the code
        shell: pwsh
        run: |
          $version = python -c "import banxing; print(banxing.__version__)"
          if ("v$version" -ne $env:VERSION) {
            throw "tag $env:VERSION does not match banxing.__version__ ($version)"
          }

      - name: Dependencies
        run: python -m pip install --upgrade pip -r requirements-windows.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build Banxing.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name Banxing
          --add-data "banxing/prompts;banxing/prompts"
          --hidden-import pystray._win32
          run.py

      - name: Self-test of the packaged app
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\selftest-packaged.json"
          $app = Start-Process -FilePath "dist\Banxing\Banxing.exe" `
            -ArgumentList "--selftest", "--require", "tk,win32", "--report", "`"$report`"" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report -Encoding utf8 } else { Write-Host "no report was written" }
          if ($app.ExitCode -ne 0) { throw "the packaged app failed its self-test (exit code $($app.ExitCode))" }
          $result = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $result.frozen) { throw "the self-test did not run from the packaged build" }
          if ("v$($result.version)" -ne $env:VERSION) { throw "packaged version $($result.version) is not $env:VERSION" }

      - name: Package
        shell: pwsh
        run: |
          $name = "Banxing-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Path "release" | Out-Null
          Copy-Item "dist\Banxing" "release\$name" -Recurse
          Copy-Item "packaging\windows\README.txt" "release\$name\README.txt"
          Copy-Item "docs\verification.md" "release\$name\VERIFICATION.md"
          Copy-Item "docs\acceptance.md" "release\$name\ACCEPTANCE.md"
          Compress-Archive -Path "release\$name" -DestinationPath "release\$name.zip"
          (Get-FileHash "release\$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "release\$name.zip.sha256"

      - name: Keep the build and reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ env.VERSION }}
          path: |
            release/*.zip
            release/*.sha256
            ${{ runner.temp }}/selftest-packaged.json
          if-no-files-found: ignore

      # Checked again right before publishing: the build took minutes, and nothing may have
      # appeared under this name meanwhile.
      - name: Still nothing to overwrite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = git ls-remote --tags origin "refs/tags/$env:VERSION"
          if ($LASTEXITCODE -ne 0 -or $tags) { Write-Host "::error::tag $env:VERSION exists or could not be checked"; exit 1 }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($releases | Where-Object { $_.tag_name -eq $env:VERSION }).Count -ne 0) {
            Write-Host "::error::a release for $env:VERSION exists or could not be checked"; exit 1
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ env.TARGET_SHA }}    # the tag is created on the pinned commit
          name: Banxing ${{ env.VERSION }} Windows preview
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 伴行 · Windows 预览版

            下载 `Banxing-${{ env.VERSION }}-windows-x64.zip`，解压后双击 `Banxing.exe`（保留同目录的 `_internal` 文件夹）。
            右键伴行 →「旁听用的模型」配置在旁边读对话的模型，再 →「旁听一条对话」选一条长对话。
            伴行只读：思路走偏时出一条气泡，附出处和一句可以带回去问主模型的话。
            程序未做代码签名，Windows 提示“已保护你的电脑”时点「更多信息 → 仍要运行」。

            **验证状态（证据等级见压缩包内 `VERIFICATION.md`）**：本构建通过了 Windows 运行器上的自动化测试和打包自检
            （界面可构建、离线替身下流程可走通）。
            **旁听的模型判断得准不准，尚未用真实的模型和真实的对话评估；真实的导出文件和会话文件也未验证；
            也没有人在真实的 Windows 桌面上用过它。**
            验收步骤见 `ACCEPTANCE.md`。压缩包内的 `VERIFICATION.md` 写于这次构建之前，其中「Windows 上未运行」「工作流从未运行」
            两处说的是当时的情况。

            构建自提交 `${{ env.TARGET_SHA }}`（该提交上的 CI 运行 ${{ env.CI_RUN_ID }} 已通过，发布前由工作流复核）。

            Download the zip, unzip, double-click `Banxing.exe` (keep the `_internal` folder next to it).
            The app is unsigned: on the SmartScreen prompt choose "More info" → "Run anyway".
            This build passed the automated tests and the packaged self-test on a Windows runner. The supervising
            model's judgement has **not** been evaluated with a real model or on real conversations, and nobody has
            used it on a real Windows desktop yet; see `VERIFICATION.md` and `ACCEPTANCE.md`.
            Built from commit `${{ env.TARGET_SHA }}`.
          files: |
            release/*.zip
            release/*.sha256

      - name: The published release is the one that was meant
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:VERSION" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the release cannot be read back"; exit 1 }
          $tagged = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:VERSION" --jq ".sha"
          $assets = @($release.assets | ForEach-Object { $_.name }) -join ", "
          Write-Host "release: $($release.html_url)"
          Write-Host "prerelease: $($release.prerelease), draft: $($release.draft), tag on: $tagged"
          Write-Host "assets: $assets"
          Get-Content "release\Banxing-$env:VERSION-windows-x64.zip.sha256"
          if (-not $release.prerelease -or $release.draft) { Write-Host "::error::not a published pre-release"; exit 1 }
          if ($tagged -ne $env:TARGET_SHA) { Write-Host "::error::the tag is on $tagged, not on the pinned commit"; exit 1 }
          if (@($release.assets).Count -ne 2) { Write-Host "::error::expected two assets, found: $assets"; exit 1 }
